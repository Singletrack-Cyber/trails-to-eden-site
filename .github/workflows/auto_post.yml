name: 3x Daily AI Articles
on:
  schedule:
    - cron: '0 9,13,17 * * *'
  workflow_dispatch: 

jobs:
  write-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install --target . google-generativeai
          PYTHONPATH=. python generate_articles.py
        
      - name: Push Changes
        run: |
          git config user.name "EdenBot"
          git config user.email "bot@trailstoeden.com"
          git add data.js
          git commit -m "Automated Data Update" || echo "No changes to commit"
          git push
